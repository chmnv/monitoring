# Notification policy tree (root). Routes every firing alert to the email
# contact point. Grouping keeps related alerts in one email; repeat_interval
# limits how often an unresolved alert is re-sent.
apiVersion: 1

policies:
  - orgId: 1
    receiver: email-admin
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
