# Notification policy tree (root).
# Default route → Telegram (messenger). Email contact point stays available
# if you add a child policy later or change receiver back to email-admin.
apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
