# Dashboard provisioning provider.
# Grafana scans the `path` below on startup (and every updateIntervalSeconds)
# and loads every *.json dashboard it finds — dashboards-as-code.
apiVersion: 1

providers:
  - name: default
    orgId: 1
    # Grafana folders are derived from the subdirectory names under `path`
    # (see foldersFromFilesStructure below), so no fixed folder here.
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    # Allow editing in the UI (changes are kept until the file is reloaded).
    allowUiUpdates: true
    options:
      # Path INSIDE the container (mounted from ./grafana/dashboards).
      path: /var/lib/grafana/dashboards
      # Map each subfolder (1 Overview & SRE, 2 Infrastructure, ...) to a Grafana folder.
      foldersFromFilesStructure: true
