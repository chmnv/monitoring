# JMX Exporter config for WildFly (javaagent on :9404).
#
# Goal: keep the stable JVM/process metrics our dashboards and alerts use,
# without scraping WildFly/JBoss MBeans. Those MBeans produce high-cardinality
# series with dynamic IDs (e.g. jboss_remoting_endpoint_remoting_<uuid>_*) and
# duplicate what we already get cleanly from :9990/metrics (job wildfly-management).
#
# The javaagent always registers Prometheus DefaultExports (jvm_*, process_*),
# independent of the rules below. includeObjectNames points at a non-existent
# MBean so the JmxCollector emits no extra attribute series.

lowercaseOutputName: true
lowercaseOutputLabelNames: true

includeObjectNames:
  - "monitoring.local:type=Disabled"

rules:
  - pattern: ".*"
