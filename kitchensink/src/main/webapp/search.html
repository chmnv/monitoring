<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>kitchensink — Search</title>
  <link rel="stylesheet" href="resources/css/screen.css"/>
  <style>
    #search-box { display: flex; gap: 8px; margin: 1em 0; align-items: center; }
    #search-box input[type=text] { flex: 1; max-width: 320px; padding: 4px 8px; }
    #status { color: #555; margin: 0.5em 0 1em; }
    #results { width: 100%; border-collapse: collapse; }
    #results th, #results td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    #results th { background: #eee; }
    .nav { margin-bottom: 1em; }
  </style>
</head>
<body>
  <div id="container">
    <div id="content">
      <p class="nav"><a href="index.jsf">← Registration</a></p>
      <h1>Member search</h1>
      <p>Minimal UI for dashboard <b>11 Search &amp; Discovery</b>.
         Calls <code>/rest/members/search</code> (same metrics as the load script).</p>

      <div id="search-box">
        <label for="q">Name contains</label>
        <input id="q" type="text" placeholder="e.g. Load, Jane, a" autofocus/>
        <button id="go" type="button">Search</button>
      </div>
      <p id="status">Type a query and press Search (or Enter).</p>

      <table id="results" class="simpletablestyle" hidden>
        <thead>
          <tr><th>Id</th><th>Name</th><th>Email</th><th>Phone</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script>
    (function () {
      var q = document.getElementById('q');
      var go = document.getElementById('go');
      var status = document.getElementById('status');
      var table = document.getElementById('results');
      var tbody = table.querySelector('tbody');
      var base = window.location.pathname.replace(/\/[^/]*$/, '') || '';

      function run() {
        var query = q.value;
        status.textContent = 'Searching…';
        table.hidden = true;
        tbody.innerHTML = '';
        var url = base + '/rest/members/search' +
          (query.length ? ('?q=' + encodeURIComponent(query)) : '');
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function (rows) {
            if (!Array.isArray(rows)) rows = [];
            var label = !query.trim() ? 'empty query' :
              (query.trim().length <= 2 ? 'refine (short)' :
                (rows.length ? 'hit' : 'zero'));
            status.textContent = rows.length + ' result(s) — outcome ≈ ' + label;
            rows.forEach(function (m) {
              var tr = document.createElement('tr');
              tr.innerHTML = '<td>' + m.id + '</td><td>' + escapeHtml(m.name) +
                '</td><td>' + escapeHtml(m.email) + '</td><td>' +
                escapeHtml(m.phoneNumber) + '</td>';
              tbody.appendChild(tr);
            });
            table.hidden = rows.length === 0;
          })
          .catch(function (e) {
            status.textContent = 'Search failed: ' + e.message;
          });
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      go.addEventListener('click', run);
      q.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') run();
      });
    })();
  </script>
</body>
</html>
