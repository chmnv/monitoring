# Local monitoring platform — Compose stack.
# Services: WildFly app + Prometheus (metrics) + Grafana (UI) + Loki/Promtail (logs).
# Host metrics come from windows_exporter running natively on the Windows host.

name: monitoring

services:
  # ---------------------------------------------------------------------------
  # WildFly 39 (JDK 21) running kitchensink.war + JMX Exporter agent (:9404).
  # Built from ./wildfly using the SAME two-context setup as the manual build,
  # so the project architecture is unchanged.
  # ---------------------------------------------------------------------------
  wildfly:
    build:
      context: ./wildfly
      # Compose equivalent of `--build-context kitchensink=...`: supplies the
      # local Quickstarts source as the named context the Dockerfile expects.
      additional_contexts:
        # App source lives in-repo so business-metric changes are versioned with the stack.
        kitchensink: ./kitchensink
      # Management user baked in at build time (see Dockerfile ARGs). Kept here so
      # the credentials live in one place; move to an .env file when needed.
      args:
        MGMT_USER: admin
        MGMT_PASSWORD: admin
    image: monitoring-wildfly:1.0
    container_name: wildfly
    restart: unless-stopped
    ports:
      - "8080:8080"   # application
      - "9404:9404"   # JMX Exporter (Prometheus scrape target)
      - "9990:9990"   # WildFly management console / API
    volumes:
      # Share WildFly's log directory with Promtail via a named volume so the
      # server.log lines can be tailed and shipped to Loki.
      - wildfly-logs:/opt/jboss/wildfly/standalone/log
    networks:
      - monitoring
    healthcheck:
      # curl ships in the WildFly image; a 2xx from the deployed app means "ready".
      test: ["CMD", "curl", "-f", "http://localhost:8080/kitchensink/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s   # WildFly boot + deploy takes a while; don't fail early

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes the JMX Exporter over the Docker network (not localhost).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0   # pinned LTS, official image, no :latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # cap disk usage for a local stack
      - --web.enable-lifecycle              # allows `POST /-/reload` on config change
      - --web.enable-admin-api              # allows TSDB admin ops (delete_series)
    volumes:
      # Config mounted read-only so the container can never mutate it.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Named volume keeps the TSDB across restarts / recreations.
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus web UI / API
    networks:
      - monitoring
    # Lets Prometheus reach services running on the Windows host (windows_exporter
    # on :9182) via the hostname host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Start independently of WildFly health so that when the app is DOWN,
    # Prometheus/Grafana still run and can show up=0 + fire email alerts.
    # Soft ordering only: try to start after wildfly container exists.
    depends_on:
      - wildfly
    healthcheck:
      # wget ships in the Prometheus (busybox-based) image; /-/healthy is built in.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Grafana — visualization UI. Prometheus is auto-provisioned as the default
  # datasource; no manual setup needed. (Dashboards come in a later step.)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.1   # pinned, official image, no :latest
    container_name: grafana
    restart: unless-stopped
    environment:
      # Local admin credentials. Move to an .env / secret for real deployments.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous sign-up disabled — login required.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # --- SMTP for email alerting (values come from .env, git-ignored) ---
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM}
      GF_SMTP_FROM_NAME: "Grafana Alerts"
      # Gmail uses STARTTLS on 587; upgrade the plaintext connection to TLS.
      GF_SMTP_STARTTLS_POLICY: OpportunisticStartTLS
      # Exposed to alerting provisioning via $__env{...}.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      # Provisioning mounted read-only: Grafana reads datasource + dashboard
      # provider config on boot.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON files (dashboards-as-code), scanned by the file provider.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Named volume persists Grafana's own DB (users, prefs) across recreations.
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana web UI
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy   # datasource target must be up first
      jira-bridge:
        condition: service_healthy
    healthcheck:
      # curl ships in the Grafana image; /api/health is Grafana's built-in probe.
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Loki — log aggregation backend (the "Prometheus for logs"). Single-binary
  # mode with local filesystem storage; queried by Grafana via LogQL.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.5.1   # pinned, official image, no :latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki            # named volume keeps chunks + index across restarts
    ports:
      - "3100:3100"   # Loki HTTP API (push + query)
    networks:
      - monitoring
    healthcheck:
      # busybox wget ships in the Loki image; /ready flips to 200 once Loki is up.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Promtail — log shipper. Tails WildFly's server.log from the shared volume,
  # parses it, and pushes labeled streams to Loki.
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.5.1   # pinned, official image, no :latest
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only view of WildFly's logs (same named volume the app writes to).
      - wildfly-logs:/var/log/wildfly:ro
    networks:
      - monitoring
    # No healthcheck: this image ships without wget/curl, and nothing depends on
    # Promtail being "healthy" (Loki accepts pushes whenever Promtail is ready).
    depends_on:
      loki:
        condition: service_healthy   # don't ship before Loki can accept pushes

  # ---------------------------------------------------------------------------
  # jira-bridge — Grafana webhook → Jira Cloud issue create.
  # Works around Grafana 11.6 native Jira notifier (410 on removed /search API).
  # ---------------------------------------------------------------------------
  jira-bridge:
    build: ./jira-bridge
    image: monitoring-jira-bridge:1.0
    container_name: jira-bridge
    restart: unless-stopped
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
      JIRA_ISSUE_TYPE_ID: ${JIRA_ISSUE_TYPE_ID:-}
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Host-level metrics come from windows_exporter, which runs natively on the
# Windows host (NOT in Docker) and is scraped by Prometheus via
# host.docker.internal:9182 (see prometheus.yml). cAdvisor was dropped: on
# Docker Desktop / WSL2 it cannot resolve per-container names/labels.

# All services share one user-defined bridge network. On it, containers reach each
# other by SERVICE NAME (e.g. Prometheus -> "wildfly:9404"), so nothing depends on
# host ports or localhost.
networks:
  monitoring:
    driver: bridge

# Named volumes survive `down`/recreate; removed only with `docker compose down -v`.
volumes:
  prometheus-data:   # Prometheus time-series database
  grafana-data:      # Grafana internal DB (users, preferences, dashboard state)
  loki-data:         # Loki chunks + TSDB index
  wildfly-logs:      # WildFly standalone/log, shared read-only with Promtail
