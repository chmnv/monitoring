# Prometheus configuration for the local monitoring platform.
# Scrapes are addressed by Docker service DNS names (NOT localhost), so this file
# works unchanged regardless of host, and new targets are added by appending a
# job below — no restructuring required.

global:
  scrape_interval: 15s          # how often to pull metrics from every target
  scrape_timeout: 10s           # must be < scrape_interval; fail a scrape that hangs
  evaluation_interval: 15s      # how often recording/alerting rules are evaluated
  external_labels:
    monitor: monitoring-local   # tags every series/alert with the source stack

# Alerting / rule files are declared here later (Alertmanager step). Kept empty now.
# rule_files: []

scrape_configs:
  # Prometheus scraping itself — cheap, and useful to confirm the server is healthy.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # WildFly JVM + application metrics via the JMX Exporter java agent (:9404).
  # "wildfly" is the Compose service name, resolved over the shared Docker network.
  - job_name: wildfly-jmx
    static_configs:
      - targets: ["wildfly:9404"]
        labels:
          application: kitchensink

  # Windows host metrics (CPU/RAM/disk/network) from windows_exporter, which runs
  # natively on the host. Reached from inside the container via host.docker.internal.
  - job_name: windows
    static_configs:
      - targets: ["host.docker.internal:9182"]

  # WildFly native Prometheus metrics (MicroProfile / metrics subsystem) on the
  # management interface. Runs ALONGSIDE wildfly-jmx (mentor: both are OK).
  # Names differ from JMX Exporter (base_*/vendor_*/application_* vs jvm_*).
  - job_name: wildfly-management
    metrics_path: /metrics
    scheme: http
    # WildFly emits Prometheus text without a modern Content-Type; Prometheus 3
    # rejects that unless a fallback protocol is set.
    fallback_scrape_protocol: PrometheusText0.0.4
    # Endpoint answered without auth in our stack; keep basic_auth ready if
    # management security is tightened later.
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ["wildfly:9990"]
        labels:
          application: kitchensink
